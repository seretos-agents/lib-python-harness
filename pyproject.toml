[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lib-python-harness"
version = "0.0.11"
description = "Provider-independent subagent engine: lifecycle, dispatch and transport abstraction."
requires-python = ">=3.11"
authors = [{ name = "Arne von Appen" }]
# Runtime deps go here. Keep the surface small — this is a leaf dependency
# consumed by other projects. Empty by default.
dependencies = [
  "lib-python-config @ git+https://github.com/seretos-agents/lib-python-config@v0.1.4",
  "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m \"not requires_claude and not requires_codex and not requires_mistral\""
markers = [
  "requires_claude: needs a real installed `claude` CLI plus subscription auth; excluded by default, run explicitly with `-m requires_claude`.",
  "requires_codex: needs a real installed `codex` CLI plus ChatGPT/API auth; excluded by default, run explicitly with `-m requires_codex`.",
  "requires_mistral: needs a real installed Mistral Vibe `vibe` CLI plus Mistral auth (MISTRAL_API_KEY or keyring); excluded by default, run explicitly with `-m requires_mistral`.",
]
